<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BabyRoutine Chrome 预览</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <h1 id="title">今天</h1>
      <button id="mockBtn" class="ghost">+ 模拟记录</button>
    </header>

    <main>
      <section id="tab-today" class="tab active">
        <h2>今日时间线（玩耍自动补齐）</h2>

        <section id="statsBar" class="card stats-bar"></section>

        <div class="today-layout">
          <div class="timeline-wrap">
            <div class="timeline" id="timeline"></div>
          </div>
          <section class="card detail-card">
            <h3>活动详情</h3>
            <ul id="activityList" class="activity-list"></ul>
          </section>
        </div>

        <section class="quick">
          <button data-type="feed">记录吃奶</button>
          <button data-type="sleep">记录睡眠</button>
          <button data-type="awake">记录玩耍</button>
          <button data-type="diaper">换尿片</button>
        </section>
      </section>

      <section id="tab-add" class="tab">
        <h2>记录事件</h2>
        <form id="eventForm" class="card form">
          <label>类型
            <select id="type">
              <option value="feed">吃奶</option>
              <option value="sleep">睡眠</option>
              <option value="awake">玩耍</option>
            </select>
          </label>
          <label>开始 <input id="start" type="datetime-local" /></label>
          <label>结束 <input id="end" type="datetime-local" /></label>
          <label id="amountWrap">奶量(ml) <input id="amount" type="number" min="0" /></label>
          <label>备注 <input id="note" type="text" placeholder="可选" /></label>
          <button type="submit" class="primary">保存</button>
        </form>
      </section>

      <section id="tab-history" class="tab">
        <h2>最近7天</h2>
        <ul id="history" class="list card"></ul>
      </section>

      <section id="tab-soothe" class="tab">
        <h2>哄睡记录</h2>
        <form id="sootheForm" class="card form">
          <label>时间 <input id="sootheAt" type="datetime-local" /></label>
          <label>时长(分钟) <input id="sootheDuration" type="number" min="1" value="15" /></label>
          <label>备注 <input id="sootheNote" type="text" placeholder="如：抱睡/拍嗝后入睡" /></label>
          <button type="submit" class="primary">保存哄睡</button>
        </form>
        <ul id="sootheList" class="list card"></ul>
      </section>

      <section id="tab-settings" class="tab">
        <h2>设置</h2>
        <div class="card form">
          <label><input id="reminder" type="checkbox" checked /> 开启提醒</label>
          <label>奶前提醒：<input id="feedLead" type="range" min="5" max="30" value="15" /> <span id="feedLeadText">15</span> 分钟</label>
          <label>清醒窗提醒：<input id="awakeLead" type="range" min="5" max="30" value="20" /> <span id="awakeLeadText">20</span> 分钟</label>
        </div>
      </section>
    </main>

    <nav class="tabs">
      <button data-tab="today" class="active">今天</button>
      <button data-tab="add">记录</button>
      <button data-tab="history">历史</button>
      <button data-tab="soothe">哄睡</button>
      <button data-tab="settings">设置</button>
    </nav>
  </div>

  <script src="./app.js"></script>
</body>
</html>
